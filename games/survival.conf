# Family world: gentle survival. Read by the Luanti server; edit, then
#   sudo offline games restart survival
# Gather, craft, farm and explore. Only peaceful animals appear, belongings are kept
# after a fall, and players cannot hurt each other.
server_name = Family world: gentle survival
server_description = Gather, craft, farm and explore. No monsters, and you keep your things.
motd = Welcome to the family survival world.
default_game = mineclonia
creative_mode = false
enable_damage = true
only_peaceful_mobs = true
mcl_keepInventory = true
enable_pvp = false

# The first person to join under this name is the world's administrator and can
# grant or remove privileges. An adult should join as "parent" before anyone else.
name = parent

# Each player chooses a name and a password on first joining.
disallow_empty_password = true
max_users = 12

# The world stays in the house: it is never listed on the public server list.
server_announce = false
port = 30000
bind_address = 0.0.0.0
ipv6_server = false

# Mods run in the engine's sandbox and none is trusted with more.
secure.enable_security = true
