# Offline content sharing. Started by offline-rsync.service as the
# unprivileged "offline" account on 127.0.0.1:47001.
#
# Nothing reaches this daemon directly. Other systems connect to the TLS
# front end on port 47002 (offline-tls.service), which admits only holders of
# the house key and encrypts everything; the daemon then asks for the key a
# second time. Content modules are read-only and never expose hidden files,
# partial downloads or anything reached through a symbolic link.

use chroot = no
address = 127.0.0.1
max connections = 8
# The connection-count lock must live where the unprivileged daemon can write.
lock file = /run/offline/rsyncd.lock
timeout = 300
reverse lookup = no
forward lookup = no
transfer logging = no
strict modes = yes
munge symlinks = yes
numeric ids = yes

read only = yes
write only = no
list = no
auth users = offline
secrets file = /etc/offline/rsyncd.secrets
hosts allow = 127.0.0.1
hosts deny = *
refuse options = copy-links copy-dirlinks copy-unsafe-links links hard-links devices specials acls xattrs delete* remove-source-files
exclude = .* lost+found
dont compress = *

[knowledge]
    path = /srv/offline/knowledge
    comment = Offline knowledge bases

[media]
    path = /srv/offline/media
    comment = Offline films, music, radio and books

[maps]
    path = /srv/offline/maps
    comment = Offline map regions and map viewer assets

# The family vault: ciphertext only. The passphrase that turns it back into
# documents is never on disc, here or anywhere.
[vault]
    path = /srv/offline/vault
    comment = Family vault (encrypted)

# Account records: who the household's adults and children are, with password
# hashes and never a password. One small file, read-only like the content.
[accounts]
    path = /var/lib/offline/accounts
    comment = Household accounts
    read only = yes
    list = no
    include = /accounts.json
    exclude = *

# Family broadcasts this system has seen, for others to catch up on.
[broadcasts]
    path = /var/lib/offline/broadcasts
    comment = Signed family broadcasts

# Where another system hands over a broadcast for immediate display. Write-only,
# and nothing but small signed message files is accepted; each is verified
# against the house key before anything is shown.
[inbox]
    path = /var/lib/offline/inbox
    comment = Incoming family broadcasts
    read only = no
    write only = yes
    filter = + /*.json - *
    incoming chmod = D0750,F0640
    max connections = 4

