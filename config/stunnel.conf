; Offline: TLS front end for the sharing daemon. Started by offline-tls.service
; as the unprivileged "offline" account.
;
; Every other system connects here. The handshake uses a pre-shared key derived
; from the house key, over TLS 1.3 only, with a fresh X25519 exchange for each
; connection, so a system that
; does not hold the key cannot complete it, and everything after it is
; encrypted. There are no certificates to issue or expire.

foreground = yes
pid =
debug = 4
syslog = no

[offline-sync]
accept = 47002
connect = 127.0.0.1:47001
ciphers = PSK
ciphersuites = TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
sslVersionMin = TLSv1.3
options = NO_RENEGOTIATION
PSKsecrets = /etc/offline/sync.psk
TIMEOUTbusy = 60
TIMEOUTidle = 600
