# Runtime directory for the status file read by the portal.
d /run/offline 0755 offline offline -
# Portal sessions. Written by the sign-in pages (offline-auth), read by the web
# server and the portal pages (group offline-session). Kept in memory, so every
# session ends at a restart; the file must exist before the web server starts.
d /run/offline-auth 2750 offline-auth offline-session -
f /run/offline-auth/sessions.map 0640 offline-auth offline-session -
