# Offline: is this request from an adult who has signed in?
#
# Included by every site that keeps something for adults. The cookie holds 256
# random bits and nothing else; the file is written by the sign-in pages and
# lives in memory, so every session ends when the system restarts. Nothing a
# browser sends can set OFFLINE_ADULT by any other route.
RewriteEngine On
RewriteMap offline_sessions "txt:/run/offline-auth/sessions.map"
RewriteCond %{HTTP_COOKIE} "(?:^|;\s*)__Host-offline-session=([A-Za-z0-9_-]{43})(?:;|$)"
RewriteCond "${offline_sessions:%1|none}" "^adult:"
RewriteRule ^ - [E=OFFLINE_ADULT:1]
