; Offline portal: the sign-in pages.
;
; A pool of their own, running as "offline-auth". It is the only part of the
; portal that can read the account records or write a session, and it can do
; nothing else: no programs, no connections, and files only in /run/offline-auth.

[offline-auth]
user = offline-auth
group = offline-auth

listen = /run/php/offline-auth.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
pm.max_requests = 200
request_terminate_timeout = 20s

clear_env = yes
security.limit_extensions = .php
catch_workers_output = no

php_admin_value[open_basedir] = /var/www/offline/:/usr/local/lib/offline/:/run/offline/:/run/offline-auth/:/var/lib/offline/accounts/:/etc/offline/offline.conf:/etc/offline/children.local.tsv
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,popen,pcntl_exec,pcntl_fork,pcntl_signal,posix_kill,posix_setuid,posix_setgid,posix_seteuid,posix_setegid,posix_initgroups,dl,putenv,mail,symlink,link,chown,chgrp,lchown,lchgrp,touch,copy,mkdir,rmdir,tempnam,tmpfile,move_uploaded_file,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,socket_create,curl_init,curl_exec,curl_multi_exec,ini_set,ini_alter,ini_restore,set_time_limit,apache_setenv,phpinfo,show_source,highlight_file,php_uname,getmyuid,get_current_user
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[file_uploads] = off
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = syslog
php_admin_value[syslog.ident] = offline-auth
php_admin_value[memory_limit] = 64M
php_admin_value[upload_max_filesize] = 0
php_admin_value[max_execution_time] = 15
php_admin_value[post_max_size] = 4K
php_admin_value[max_input_vars] = 8
php_admin_value[session.auto_start] = 0
php_admin_flag[enable_dl] = off
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_value[date.timezone] = UTC
