# Offline settings. Plain KEY=value lines; nothing here is executed.
# Changes to SYNC_*, DOWNLOAD_*, STAGING_* and broadcast settings apply on the
# next run. After changing ROLE, PORTAL_SCOPE or SYNC_EXPOSE, run the installer
# again so the firewall, the web server and the timers follow.

# What this system is:
#   workstation  a laptop or desktop people sit at
#   server       a central system that downloads, stages and serves content
ROLE=workstation

# Who may open the web portal, the library reader and the media shares:
#   lan    this system and private addresses on the home network
#   local  this system only
PORTAL_SCOPE=lan

# Who may connect to the encrypted sharing port (TCP 47002). Either way the
# connection opens only for a system that holds the house key.
#   lan       private addresses on the home network
#   internet  any address; for a server in a datacentre (sudo ./install.sh --role server --expose internet)
SYNC_EXPOSE=lan

# Central servers to pull from, by host name or address, separated by spaces.
# They are tried at every sync, wherever this system happens to be.
# Manage the list with: sudo offline server add HOST   |   sudo offline server remove HOST
SERVERS=""

# Exchange content with other Offline systems holding the same house key.
SYNC_ENABLED=yes

# What to exchange: any of knowledge, media and maps.
SYNC_MODULES="knowledge media maps"

# Stop fetching from peers once free space would fall below this many GiB.
SYNC_MIN_FREE_GB=10

# On battery, postpone peer sync below this charge (per cent). 0 never postpones.
SYNC_MIN_BATTERY=30

# Limit peer transfers to this many KiB per second. 0 is unlimited.
SYNC_BWLIMIT_KBPS=0

# If no peer announces itself, check each address of small local networks directly.
SYNC_SCAN_FALLBACK=yes

# Delete an older edition of a ZIM once a newer edition is installed.
AUTO_PRUNE=yes

# Exchange the family vault's ciphertext with the other systems. They hold it
# and cannot read it; only the passphrase, which is stored nowhere, opens it.
VAULT_SYNC=yes

# Close an opened vault by itself after this many minutes without use. 0 never does.
VAULT_IDLE_MINUTES=30

# Accounts made with "offline user add" reach every system holding the house key.
# auto: each system also makes a login account for them, except a server exposed
#       to the internet, which keeps the records alone; a child's login account
#       is made only where there is a desktop.
# yes:  adults get a login account on this system even if it faces the internet.
# no:   this system never makes login accounts from replicated records.
ACCOUNT_LOGINS=auto

# On a server, move finished downloads from the staging area into the shared
# folders without waiting for "sudo offline stage publish". The default keeps a
# person in the loop.
STAGING_AUTOPUBLISH=no

# How long a family broadcast stays at the top of the portal, in hours (1 to 24).
BROADCAST_HOURS=12

# Send family broadcasts to the Meshtastic mesh when a node is plugged into this
# system. A broadcast is sent by the system it was written on if that has a
# node, and otherwise by every system with a node that receives it. Set this to
# no on all but one of them if repeats on the mesh are unwelcome.
MESH_GATEWAY=yes

# Parallel connections per download from Kiwix (1 to 16).
DOWNLOAD_CONNECTIONS=4

# Refuse an internet download that would leave less than this many GiB free.
DOWNLOAD_MIN_FREE_GB=5

# Kiwix library catalogue used to find current editions.
CATALOGUE_URL=https://library.kiwix.org/catalog/v2/entries

# Ollama models the installer pulls. Space separated.
OLLAMA_MODELS="qwen2.5:0.5b"
