# Offline settings. Plain KEY=value lines; nothing here is executed.
# Changes to SYNC_* and DOWNLOAD_* apply on the next run. After changing
# PORTAL_SCOPE, run the installer again so the firewall and web server follow.

# Who may open the web portal, the library reader and the media shares:
#   lan    this laptop and private addresses on the home network
#   local  this laptop only
PORTAL_SCOPE=lan

# Exchange content with other Offline laptops holding the same house key.
SYNC_ENABLED=yes

# What to exchange: any of knowledge, media and maps.
SYNC_MODULES="knowledge media maps"

# Stop fetching from peers once free space would fall below this many GiB.
SYNC_MIN_FREE_GB=10

# On battery, postpone peer sync below this charge (per cent). 0 never postpones.
SYNC_MIN_BATTERY=30

# Limit peer transfers to this many KiB per second. 0 is unlimited.
SYNC_BWLIMIT_KBPS=0

# If no peer announces itself, check each address of small local networks directly.
SYNC_SCAN_FALLBACK=yes

# Delete an older edition of a ZIM once a newer edition is installed.
AUTO_PRUNE=yes

# Parallel connections per download from Kiwix (1 to 16).
DOWNLOAD_CONNECTIONS=4

# Refuse an internet download that would leave less than this many GiB free.
DOWNLOAD_MIN_FREE_GB=5

# Kiwix library catalogue used to find current editions.
CATALOGUE_URL=https://library.kiwix.org/catalog/v2/entries

# Ollama models the installer pulls. Space separated.
OLLAMA_MODELS="qwen2.5:0.5b"
