# Offline: server-wide hardening. Installed as conf-available/zz-offline-hardening.conf
# so that it is read after Ubuntu's own security.conf and takes precedence.

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

Timeout 30
KeepAliveTimeout 5
LimitRequestBody 1048576
LimitRequestFields 50
LimitRequestFieldSize 8190
LimitRequestLine 4094
