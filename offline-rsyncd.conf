uid = root
gid = root
use chroot = no
max connections = 20
pid file = /run/offline-rsyncd.pid
lock file = /run/offline-rsyncd.lock
log file = /var/log/offline-rsyncd.log
timeout = 300

[knowledge]
    path = /srv/offline/knowledge
    comment = Offline knowledge bases
    read only = yes
    list = yes

[media]
    path = /srv/offline/media
    comment = Offline movies, radio and music
    read only = yes
    list = yes
